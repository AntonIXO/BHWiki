name: Bug report
description: Report broken navigation, rendering or data behavior.
title: "Bug: "
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps and observed behavior
      description: Include the affected route and how to reproduce. Do not include database URLs, passwords or private health data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, screen size, source commit and bundled/database mode where known.
