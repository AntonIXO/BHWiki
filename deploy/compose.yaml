name: bhwiki
services:
  web:
    image: ${BHWIKI_IMAGE:-bhwiki:local}
    # Linux host networking reaches the existing loopback PostgreSQL listener.
    # The application itself binds loopback; no public port is published here.
    network_mode: host
    env_file:
      - ${BHWIKI_ENV_FILE:-/etc/bhwiki/runtime.env}
    environment:
      NODE_ENV: production
      HOSTNAME: 127.0.0.1
      PORT: "3086"
      NEXT_TELEMETRY_DISABLED: "1"
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /app/.next/cache:rw,nosuid,size=64m,uid=1000,gid=1000
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3086/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
